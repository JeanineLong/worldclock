<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Clock Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #0b0b12;
    font-family: -apple-system, sans-serif;
    color: white;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 15px;
    height: 100vh;
}

.clock-card {
    background: #151528;
    border-radius: 20px;
    padding: 10px;
    text-align: center;
}

canvas {
    background: radial-gradient(circle, #9fffcb 65%, #3effc1 100%);
    border-radius: 50%;
}

.night canvas {
    background: radial-gradient(circle, #1a1a2e 60%, #0b0b12 100%);
}

.flag { width: 36px; }

.corner {
    position: fixed;
    width: 90px;
}

.cat { top: 5px; left: 5px; }
.dog { bottom: 5px; right: 5px; }
</style>
</head>

<body>

<!-- ✅ MUST be img tags -->
<img class="corner cat" src="https://placekitten.com/120/120">
<img class="corner dog" src="https://placedog.net/120/120">

<div class="grid">

<div class="clock-card" id="phoenix">
    <img class="flag" src="https://flagcdn.com/us.svg">
    <div>Phoenix</div>
    <canvas width="130" height="130"></canvas>
    <div class="time"></div>
    <div>MST</div>
</div>

<div class="clock-card" id="tampa">
    <img class="flag" src="https://flagcdn.com/us.svg">
    <div>Tampa</div>
    <canvas width="130" height="130"></canvas>
    <div class="time"></div>
    <div>EST/EDT</div>
</div>

<div class="clock-card" id="gothenburg">
    <img class="flag" src="https://flagcdn.com/se.svg">
    <div>Gothenburg</div>
    <canvas width="130" height="130"></canvas>
    <div class="time"></div>
    <div>CET/CEST</div>
</div>

<div class="clock-card" id="london">
    <img class="flag" src="https://flagcdn.com/gb.svg">
    <div>London</div>
    <canvas width="130" height="130"></canvas>
    <div class="time"></div>
    <div>GMT/BST</div>
</div>

</div>

<script>

var zones = {
    phoenix: "America/Phoenix",
    tampa: "America/New_York",
    gothenburg: "Europe/Stockholm",
    london: "Europe/London"
};

function getTimeParts(zone) {
    var now = new Date();
    var str = now.toLocaleString("en-US", { timeZone: zone });
    var d = new Date(str);

    var h24 = d.getHours();
    var min = d.getMinutes();

    var h12 = h24 % 12;
    if (h12 === 0) h12 = 12;

    return {
        hour: h12,
        minute: min,
        period: h24 >= 12 ? "PM" : "AM",
        hour24: h24
    };
}

function drawClock(canvas, hour, minute) {
    var ctx = canvas.getContext("2d");
    var r = canvas.width / 2;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.save();
    ctx.translate(r, r);

    // numbers
    ctx.fillStyle = "#3a0066";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (var i=1;i<=12;i++){
        var ang = i * Math.PI/6;
        ctx.rotate(ang);
        ctx.translate(0, -r*0.75);
        ctx.rotate(-ang);
        ctx.fillText(i,0,0);
        ctx.rotate(ang);
        ctx.translate(0, r*0.75);
        ctx.rotate(-ang);
    }

    function hand(pos,len,w,c){
        ctx.beginPath();
        ctx.lineWidth=w;
        ctx.strokeStyle=c;
        ctx.rotate(pos);
        ctx.moveTo(0,0);
        ctx.lineTo(0,-len);
        ctx.stroke();
        ctx.rotate(-pos);
    }

    hand((hour%12)*Math.PI/6 + minute*Math.PI/360, r*0.4, 5, "#b56bff");
    hand(minute*Math.PI/30, r*0.65, 3, "#5edfff");

    ctx.restore();
}

function update(){
    for (var id in zones){
        var el = document.getElementById(id);
        var t = getTimeParts(zones[id]);

        el.querySelector(".time").textContent =
            t.hour + ":" + ("0"+t.minute).slice(-2) + " " + t.period;

        drawClock(el.querySelector("canvas"), t.hour, t.minute);

        if (t.hour24 < 6 || t.hour24 >= 18)
            el.classList.add("night");
        else
            el.classList.remove("night");
    }
}

setInterval(update,1000);
update();

</script>

</body>
</html>
